name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  # The shared release workflow pushes the same packages to nuget.org and, when
  # PURVIEW_PUBLISH_GITHUB_PACKAGES=true, to GitHub Packages. A reusable workflow cannot grant
  # more than its caller, so the permission is declared here.
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release packages
    uses: purview-dev/build/.github/workflows/purview-release.yml@main
    with:
      # The shared workflow defaults to the 10.0.x SDK, but this repository targets net11.0 and pins
      # the .NET 11 SDK in global.json; without it the release job cannot resolve global.json.
      # Keep in sync with `sdk.version` in global.json (and with .github/workflows/pr.yml).
      dotnet-version: "11.0.100-rc.2.26504.105"
      release-mode: NuGet
      release-branch: main
    secrets: inherit
